name: CI

on:
  push:
    branches: [master, main, develop]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: pnpm/action-setup@f520eceda224fe1a4aed5a2a27a194379a409996 # v6
        with:
          version: 9.15.0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Build contracts
        run: pnpm --filter @tpb/contracts build

      - name: Lint
        run: pnpm lint

      - name: Audit credentials and environment
        run: pnpm audit:env

      - name: Prisma generate + validate
        run: |
          pnpm --filter @tpb/api prisma:generate
          pnpm --filter @tpb/api exec prisma validate
        env:
          # validate/migrate diff tidak membuka koneksi; nilai hanya harus ada.
          DATABASE_URL: mysql://ci:ci@localhost:3306/ci_validate

      - name: Start MySQL
        run: docker compose up -d db

      - name: Wait for MySQL
        run: |
          # Phase 1: wait for Docker healthcheck (root ping)
          for i in $(seq 1 60); do
            status=$(docker inspect --format='{{.State.Health.Status}}' tpb-mysql 2>/dev/null || true)
            if [ "$status" = "healthy" ]; then
              break
            fi
            sleep 2
          done
          if [ "$status" != "healthy" ]; then
            docker compose ps
            docker compose logs db
            exit 1
          fi
          # Phase 2: verify the app user can connect.
          # MySQL 8.0 init creates a temporary server, then restarts —
          # root ping may succeed during init, but the app user does not exist yet.
          for i in $(seq 1 30); do
            if mysql -h 127.0.0.1 -u tpb -ptpb-dev-password -e "SELECT 1" tpb >/dev/null 2>&1; then
              echo "MySQL app user ready."
              exit 0
            fi
            sleep 2
          done
          echo "App user not ready after 60s"
          docker compose logs db
          exit 1

      - name: Apply MySQL migrations
        run: pnpm --filter @tpb/api prisma:deploy
        env:
          DATABASE_URL: mysql://tpb:tpb-dev-password@localhost:3306/tpb

      - name: Unit tests (API, mocked)
        run: pnpm --filter @tpb/api test -- --ci

      - name: API integration smoke test
        run: |
          DATABASE_URL=mysql://tpb:tpb-dev-password@localhost:3306/tpb \
          NODE_ENV=test JWT_ACCESS_SECRET=ci-test-secret-please-replace \
          CORS_ORIGINS=http://localhost:5173 COOKIE_SECURE=false MEDIA_DIR=/tmp/tpb-media \
          pnpm --filter @tpb/api build
          DATABASE_URL=mysql://tpb:tpb-dev-password@localhost:3306/tpb \
          NODE_ENV=test JWT_ACCESS_SECRET=ci-test-secret-please-replace \
          CORS_ORIGINS=http://localhost:5173 COOKIE_SECURE=false MEDIA_DIR=/tmp/tpb-media \
          PORT=3000 node apps/api/dist/main.js > /tmp/tpb-api.log 2>&1 &
          api_pid=$!
          trap 'kill $api_pid || true' EXIT
          for i in $(seq 1 30); do curl --fail --silent http://127.0.0.1:3000/v1/health && exit 0; sleep 2; done
          cat /tmp/tpb-api.log
          exit 1

      - name: Verify migrations (history against schema)
        run: |
          mysql -h 127.0.0.1 -u root -ptpb-root-dev-password -e "DROP DATABASE IF EXISTS tpb_shadow; CREATE DATABASE tpb_shadow; GRANT ALL ON tpb_shadow.* TO 'tpb'@'%';"
          cd apps/api && pnpm exec prisma migrate diff \
            --from-migrations ./prisma/migrations \
            --to-schema-datamodel prisma/schema.prisma \
            --shadow-database-url 'mysql://tpb:tpb-dev-password@localhost:3306/tpb_shadow' \
            --script --exit-code
        env:
          DATABASE_URL: mysql://ci:***@localhost:3306/ci_validate

      - name: Typecheck
        run: pnpm -r typecheck

      - name: Build API
        run: pnpm --filter @tpb/api build

      - name: Build web
        run: pnpm --filter @tpb/web build
        env:
          VITE_API_URL: /v1
