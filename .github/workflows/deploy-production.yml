name: Deploy Production

on:
  push:
    tags:
      - "v*"

jobs:
  deploy:
    runs-on: ubuntu-latest
    # GitHub Environment "production" = manual approval gate
    environment: production
    steps:
      - name: Trigger aaPanel Webhook (production)
        env:
          REF_NAME: ${{ github.ref_name }}
          WEBHOOK_URL: ${{ secrets.AAPANEL_PRODUCTION_WEBHOOK_URL }}
        run: |
          payload=$(jq -n --arg ref "$REF_NAME" '{event: "deploy", ref: $ref}')
          curl -fsSL -X POST \
            -H "Content-Type: application/json" \
            -d "$payload" \
            "$WEBHOOK_URL"
