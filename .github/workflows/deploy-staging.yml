name: Deploy Staging

on:
  push:
    branches: [develop]

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - name: Trigger aaPanel Webhook (staging)
        env:
          REF_NAME: ${{ github.ref_name }}
          WEBHOOK_URL: ${{ secrets.AAPANEL_STAGING_WEBHOOK_URL }}
        run: |
          payload=$(jq -n --arg ref "$REF_NAME" '{event: "deploy", ref: $ref}')
          curl -fsSL -X POST \
            -H "Content-Type: application/json" \
            -d "$payload" \
            "$WEBHOOK_URL"
